name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock -r news/requirements.txt pytest==9.0.2

      - name: Compile and check Python syntax
        run: |
          python -m compileall backend/ ranking/

      - name: Offline full-cycle and algorithm regression
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest retriever/tests llm/cluster_merge/tests backend/tests/test_full_cycle.py -q
          python -m unittest discover -s backend/tests/analyst -t backend -q

      - name: Run E2E Backend Tests
        run: |
          python backend/test_e2e.py

  frontend-checks:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript & Vite Build
        working-directory: frontend
        run: npm run build

  docker-compose-check:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker compose config
        run: docker compose config
