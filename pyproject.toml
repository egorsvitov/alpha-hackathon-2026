[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-personalization"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["jsonschema==4.25.1", "rfc3339-validator==0.1.4", "rfc3986-validator==0.1.1"]

[project.optional-dependencies]
embeddings = ["numpy==2.5.4", "onnxruntime==1.31.0", "tokenizers==0.23.3"]

[tool.setuptools.packages.find]
include = ["ranking*", "llm*", "retriever*"]
namespaces = true

[tool.setuptools.package-data]
retriever = ["config/*.json", "contracts/*.json", "evaluation/embeddings/*.json"]
