[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-personalization"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["jsonschema==4.25.1", "rfc3339-validator==0.1.4", "rfc3986-validator==0.1.1"]

[project.optional-dependencies]
retriever = ["numpy==2.5.4", "pydantic==2.14.1", "openai==2.29.0", "httpx==0.28.1"]

[project.scripts]
alpha-retriever = "retriever.__main__:main"

[tool.setuptools.packages.find]
include = ["ranking*", "llm*", "retriever*"]
namespaces = true
