# Общие заголовки безопасности. nginx не наследует add_header в location, где есть свой add_header,
# поэтому файл подключается и на уровне server, и в каждом таком location.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
