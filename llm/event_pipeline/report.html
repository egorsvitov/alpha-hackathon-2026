<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Путь новостей к событиям</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#18243a;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1500px;margin:auto;padding:24px}h1{font-size:28px;margin:0}h2{font-size:18px}p{margin:6px 0}.muted{color:#607086}.stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px}.stats b{font-size:22px}.flow{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:60px;align-items:start;margin:24px 0}section{min-width:0}.list{display:flex;flex-direction:column;gap:9px}button{font:inherit;text-align:left;cursor:pointer;border:1px solid #d1d9e5;border-radius:10px;padding:12px;background:white;color:inherit;width:100%;overflow-wrap:anywhere;position:relative}button:hover,button.selected{border-color:#2065db;box-shadow:0 0 0 2px #2065db22}button.dim{opacity:.38}small{display:block;color:#607086}.pill{display:inline-block;border-radius:6px;background:#edf1f8;padding:1px 6px;margin:3px 4px 0 0;font-size:12px}.detail{background:white;border:1px solid #d9e0ea;border-radius:12px;padding:20px;margin:16px 0}.detail pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 system-ui;margin:12px 0}.sources{display:grid;grid-template-columns:1fr 1fr;gap:24px}.quote{border-left:3px solid #2065db;padding:8px 12px;background:#f1f6ff;white-space:pre-wrap;margin:10px 0}#edges{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;overflow:visible}input{padding:10px;border:1px solid #ccd6e5;border-radius:8px;width:100%;max-width:500px;font:inherit}summary{cursor:pointer;font-weight:600}a{color:#135ec2}mark{background:#ffe698} @media(max-width:800px){.flow{gap:12px}.sources{grid-template-columns:1fr}button{padding:8px;font-size:13px}header,main{padding:14px}#edges{display:none}}
</style>
<header><h1>Путь новостей к событиям</h1><p class="muted">Выберите новость, упоминание или кластер. Исходники и решения доступны целиком; стрелки показывают происхождение, а не причинность.</p><div id="stats" class="stats"></div></header>
<main><input id="search" aria-label="Поиск по текстам" placeholder="Найти текст, источник или формулировку"><div class="flow" id="flow"><svg id="edges" aria-hidden="true"></svg><section><h2>1 · Новости</h2><div id="docs" class="list"></div></section><section><h2>2 · Упоминания</h2><div id="mentions" class="list"></div></section><section><h2>3 · Кластеры</h2><div id="clusters" class="list"></div></section></div><div id="detail" aria-live="polite"></div><details class="detail"><summary>Покрытие извлечения и ошибки</summary><pre id="audit"></pre></details><details class="detail"><summary>Отчёт запуска</summary><pre id="report"></pre></details></main>
<script>
const D=/*PIPELINE_DATA*/;
const docs=new Map(D.documents.map(d=>[d.document_id,d])), ms=new Map(D.mentions.map(m=>[m.mention_id,m]));
const membership=new Map(D.clusters.flatMap(c=>c.mention_ids.map(id=>[id,c.cluster_id])));
function mentionLabel(m){if(m.gloss)return m.gloss;const d=docs.get(m.document_id),bid=m.block_ids.find(b=>b.includes(':text:'))||m.block_ids[0],v=bid.split(':').slice(-2).map(Number);return Array.from(bid.includes(':title:')?d.article.title:d.article.text).slice(v[0],v[1]).join('')||'Упоминание без пересказа'}
let selected={type:null,id:null};
const el=(tag,text,cls)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const short=(t,n=110)=>(t||'').length>n?t.slice(0,n)+'…':t;
const statusLabel={assessed:'Проверено моделью',unassessed:'Не проверено',uncertain:'Неопределённость',not_required:'Кандидаты не найдены'};
for(const [n,v] of [['Новости',D.documents.length],['Упоминания',D.mentions.length],['Кластеры',D.clusters.length],['Запросы',D.report.requests],['Неопределённые',D.report.unresolved_mentions]]){let p=el('div');p.append(el('b',String(v??'—')),el('small',n));document.getElementById('stats').append(p)}
document.getElementById('report').textContent=JSON.stringify(D.report,null,2);document.getElementById('audit').textContent=JSON.stringify(D.audit,null,2);
function choose(type,id){selected={type,id};render();details(type,id)}
function button(parent,id,title,sub,type,active){let b=el('button',undefined,active?'selected':'');b.id=id;b.append(el('span',title),el('small',sub));b.onclick=()=>choose(type,id.slice(2));document.getElementById(parent).append(b);return b}
function render(){['docs','mentions','clusters'].forEach(x=>document.getElementById(x).replaceChildren());const query=document.getElementById('search').value.toLocaleLowerCase();let activeM=new Set();if(selected.type==='d')D.mentions.filter(m=>m.document_id===selected.id).forEach(m=>activeM.add(m.mention_id));if(selected.type==='m')activeM.add(selected.id);if(selected.type==='c')D.clusters.find(c=>c.cluster_id===selected.id)?.mention_ids.forEach(id=>activeM.add(id));const activeD=new Set([...activeM].map(id=>ms.get(id)?.document_id)),activeC=new Set([...activeM].map(id=>membership.get(id)));
for(const d of D.documents){if(query&&!JSON.stringify(d.article).toLocaleLowerCase().includes(query))continue;let b=button('docs','d:'+d.document_id,short(d.article.title||d.article.text),`${d.article.source||'Источник неизвестен'} · ${d.article.published_at||'Дата неизвестна'}`,'d',activeD.has(d.document_id)||selected.id===d.document_id);if(selected.type&&!activeD.has(d.document_id)&&selected.id!==d.document_id)b.classList.add('dim')}
for(const m of D.mentions){if(query&&!JSON.stringify([m,docs.get(m.document_id)?.article.text]).toLocaleLowerCase().includes(query))continue;let b=button('mentions','m:'+m.mention_id,short(mentionLabel(m)),docs.get(m.document_id)?.article.source||'','m',activeM.has(m.mention_id));if(selected.type&&!activeM.has(m.mention_id))b.classList.add('dim')}
for(const c of D.clusters){if(query&&!c.mention_ids.some(id=>document.getElementById('m:'+id)))continue;let b=button('clusters','c:'+c.cluster_id,short(c.label===c.cluster_id||c.label.startsWith('unassessed:')?mentionLabel(ms.get(c.mention_ids[0])):c.label),`${c.mention_ids.length} упоминаний · ${statusLabel[c.verification_status]||c.verification_status}`,'c',activeC.has(c.cluster_id)||selected.id===c.cluster_id);if(selected.type&&!activeC.has(c.cluster_id)&&selected.id!==c.cluster_id)b.classList.add('dim')}
requestAnimationFrame(lines)}
function lines(){const svg=document.getElementById('edges');svg.replaceChildren();const r=document.getElementById('flow').getBoundingClientRect();function edge(a,b,on){a=document.getElementById(a);b=document.getElementById(b);if(!a||!b)return;const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();let path=document.createElementNS('http://www.w3.org/2000/svg','path');let x1=x.right-r.left,x2=y.left-r.left,y1=x.top+x.height/2-r.top,y2=y.top+y.height/2-r.top;path.setAttribute('d',`M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`);path.setAttribute('stroke',on?'#2065db':'#cbd5e1');path.setAttribute('stroke-width',on?'2':'1');path.setAttribute('fill','none');svg.append(path)}for(const m of D.mentions){edge('d:'+m.document_id,'m:'+m.mention_id,selected.id===m.document_id||selected.id===m.mention_id);edge('m:'+m.mention_id,'c:'+membership.get(m.mention_id),selected.id===m.mention_id||selected.id===membership.get(m.mention_id))}}
function original(d,mention){let card=el('div',undefined,'detail');card.append(el('h2',d.article.source||'Источник'),el('p',d.article.title),el('p',d.article.published_at||'Дата публикации неизвестна','muted'));if(d.article.url&&/^https?:\/\//i.test(d.article.url)){let a=el('a','Открыть публикацию');a.href=d.article.url;a.target='_blank';a.rel='noopener noreferrer';card.append(a)}let text=el('pre');const intervals=(mention?.block_ids||[]).filter(b=>b.includes(':text:')).map(b=>b.split(':').slice(-2).map(Number)).sort((a,b)=>a[0]-b[0]);let chars=Array.from(d.article.text),p=0;for(const [start,end]of intervals){if(start<p)continue;text.append(document.createTextNode(chars.slice(p,start).join('')),el('mark',chars.slice(start,end).join('')));p=end}text.append(document.createTextNode(chars.slice(p).join('')));card.append(text);let prov=el('details');prov.append(el('summary','Происхождение'),el('pre',JSON.stringify(d.provenance,null,2)));card.append(prov);return card}
function details(type,id){let area=document.getElementById('detail');area.replaceChildren();if(type==='d'){area.append(original(docs.get(id)));return}if(type==='m'){let m=ms.get(id),card=el('div',undefined,'detail');card.append(el('h2',mentionLabel(m)),el('pre',JSON.stringify(m.hints,null,2)),el('p','Подсвечены исходные блоки. Их наличие не доказывает правильность пересказа.','muted'));area.append(card,original(docs.get(m.document_id),m));const step=D.decisions.find(s=>s.mention_id===id);if(step){let detail=el('details',undefined,'detail');detail.open=true;detail.append(el('summary','Поиск кандидатов и решение'),el('pre',JSON.stringify(step,null,2)));area.append(detail)}return}let c=D.clusters.find(c=>c.cluster_id===id),card=el('div',undefined,'detail');card.append(el('h2',c.label),el('p',statusLabel[c.verification_status]||c.verification_status),el('p','Название — навигационная метка из одного упоминания. Значения источников не согласовывались.','muted'));for(const mid of c.mention_ids){let m=ms.get(mid),b=el('button',`${docs.get(m.document_id)?.article.source}: ${mentionLabel(m)}`);b.onclick=()=>choose('m',mid);card.append(b)}card.append(el('pre',JSON.stringify(c.decisions,null,2)));area.append(card)}
document.getElementById('search').oninput=render;window.addEventListener('resize',lines);render();
</script></html>
